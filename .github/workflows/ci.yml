name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked --extra test
      - run: uv run --locked pytest -v --durations=20 -o faulthandler_timeout=120
      - run: node tests/web_frontend_smoke.cjs src/contextopus/interfaces/web/static/app.js
      - run: uv build --no-sources
      - run: uv run --locked python scripts/build_release.py
      - run: uv run --locked python scripts/verify_release.py
      - name: Install and verify wheel
        shell: bash
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/contextopus-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/contextopus-bin
        run: |
          version=$(uv run --locked python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          uv tool install "./dist/contextopus_core-${version}-py3-none-any.whl"
          if [ "$RUNNER_OS" = Windows ]; then
            "$UV_TOOL_BIN_DIR/contextopus.exe" --version
            "$UV_TOOL_DIR/contextopus-core/Scripts/python.exe" scripts/verify_installed.py --expected-version "$version"
          else
            "$UV_TOOL_BIN_DIR/contextopus" --version
            "$UV_TOOL_DIR/contextopus-core/bin/python" scripts/verify_installed.py --expected-version "$version"
          fi
